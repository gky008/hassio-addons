name: "bleachwrt"
version: "latest"
slug: "bleachwrt"
description: "bleachwrthaos - 提供旁路由管理功能，集成WEB管理界面"
url: "https://github.com/gky008/hassio-addons/main/bleachwrt"
arch:
  - amd64
startup: application
boot: manual
init: false
network:
  mode: macvlan
  interfaces:
    - macnet
  parent: enp2s1
privileged:
  - NET_ADMIN
  - SYS_ADMIN
  - SYS_RAWIO
  - SYS_TIME
  - SYS_NICE
  - SYS_MODULE
  - NET_RAW
webui: "http://192.168.2.100:[PORT:80]/"
watchdog: "http://192.168.2.100:[PORT:80]/"
apparmor: false
options:
  virtual_ip: 192.168.2.100
  netmask: 255.255.255.0
  gateway: 192.168.2.1
  enable_forwarding: true
  log_level: "info"
schema:
  virtual_ip: str
  netmask: str
  gateway: str
  enable_forwarding: bool
  log_level: list(info|debug)
image: gky008/bleachwrthaos
