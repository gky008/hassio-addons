name: "BleachWRT"
version: "20250606"
slug: "bleachwrt"
description: "BleachWRT - 提供旁路由管理功能，集成WEB管理界面"
url: "https://github.com/gky008/hassio-addons"
arch:
  - aarch64
  - amd64
startup: application
boot: manual
ports:
  80/tcp: 88
ports_description:
  88/tcp: "WEB服务端口"
init: false
host_network: true
privileged:
  - NET_ADMIN
  - SYS_ADMIN
  - SYS_RAWIO
  - SYS_TIME
  - SYS_NICE
  - SYS_MODULE
  - NET_RAW
webui: "http://[HOST]:[PORT:88]/"
watchdog: "http://[HOST]:[PORT:88]/"
apparmor: false
options:
  virtual_ip: 192.168.68.111
  netmask: 255.255.255.0
  gateway: 192.168.68.1
  enable_forwarding: true
  log_level: "info"
schema:
  virtual_ip: str
  netmask: str
  gateway: str
  enable_forwarding: bool
  log_level: list(info|debug)
image: hou6807628/openwrt:latest
