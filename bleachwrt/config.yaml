name: "bleachwrt"
version: "latest"
slug: "bleachwrt"
description: "bleachwrthaos - 提供旁路由管理功能，集成WEB管理界面"
url: "https://github.com/gky008/hassio-addons/main/bleachwrt"
arch:
  - amd64
startup: application
boot: manual
init: false
ports:
  80/tcp: 88
ports_description:
  88/tcp: "WEB服务端口"
host_network: false
network:
  interfaces:
    - macvlan
  mode: macvlan
privileged:
  - NET_ADMIN
  - SYS_ADMIN
  - SYS_RAWIO
  - SYS_TIME
  - SYS_NICE
  - SYS_MODULE
  - NET_RAW
webui: "http://192.168.2.100:[PORT:80]/"
watchdog: "http://192.168.2.100:[PORT:80]/"
apparmor: false
options:
  virtual_ip: 192.168.2.100
  netmask: 255.255.255.0
  gateway: 192.168.2.1
  enable_forwarding: true
  log_level: "info"
schema:
  virtual_ip: str
  netmask: str
  gateway: str
  enable_forwarding: bool
  log_level: list('info', 'debug')  # 修正列表格式，用逗号分隔选项
image: gky008/bleachwrthaos
